name: mapillary-test
on:
  workflow_dispatch:
  push:
    paths: ["scripts/mapillary_test.py"]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/mapillary_test.py
        env:
          MAPILLARY_TOKEN: ${{ secrets.MAPILLARY_TOKEN }}
      - run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add test_out
          git commit -m "Mapillary test output" || true
          git push || true
