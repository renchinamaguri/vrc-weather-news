name: Update weather & spots

on:
  schedule:
    - cron: "*/30 * * * *"   # 30分ごと（GitHubの混雑で数分〜十数分遅れることがあります）
  workflow_dispatch:          # 手動実行ボタン
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore spot image cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: spots-v1-${{ github.run_id }}
          restore-keys: spots-v1-
      - name: Install libraries
        run: pip install --quiet pillow qrcode
      - name: Fetch data
        run: python scripts/fetch.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
